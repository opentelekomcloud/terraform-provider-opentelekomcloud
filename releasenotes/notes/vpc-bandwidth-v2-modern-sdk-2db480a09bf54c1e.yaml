---
features:
  - |
    **[VPC]** Add enterprise project, public border group, billing, timestamp,
    and associated EIP attributes to ``resource/opentelekomcloud_vpc_bandwidth_v2``
    and ``data-source/opentelekomcloud_vpc_bandwidth_v2``.
fixes:
  - |
    **[VPC]** Migrate shared bandwidth creation, deletion, EIP association,
    EIP removal, and detail queries to modern VPC SDK operations for
    ``resource/opentelekomcloud_vpc_bandwidth_v2`` and
    ``resource/opentelekomcloud_vpc_bandwidth_associate_v2``.
  - |
    **[VPC]** Make shared-bandwidth association updates and deletion idempotent
    when an EIP has already been detached or deleted.
  - |
    **[VPC]** Preserve the dual-stack public IP type required when removing
    ECS IPv6 port IDs from shared bandwidths.
